name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payflow
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://payflow:payflow@localhost:5432/payflow?schema=public

      - name: Run Prisma migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://payflow:payflow@localhost:5432/payflow?schema=public

      - name: Run unit tests
        run: npm run test:unit

      - name: Run PostgreSQL integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://payflow:payflow@localhost:5432/payflow?schema=public

      - name: Run API and worker E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://payflow:payflow@localhost:5432/payflow?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: payflow-ci-access-secret-32-chars-long
          JWT_REFRESH_SECRET: payflow-ci-refresh-secret-32-chars-long

      - name: Build API and worker
        run: npm run build
        env:
          DATABASE_URL: postgresql://payflow:payflow@localhost:5432/payflow?schema=public
